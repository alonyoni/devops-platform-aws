## kube-prometheus-stack Helm Values
## Chart: prometheus-community/kube-prometheus-stack  v57.0.3
## Deploys: Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics

# -------------------------------------------------------------------
# Global
# -------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false        # Disabled — EKS uses ipvs without standard kubeProxy metrics
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false    # EKS manages scheduler — not accessible
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# -------------------------------------------------------------------
# Prometheus Operator
# -------------------------------------------------------------------
prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# -------------------------------------------------------------------
# Prometheus
# -------------------------------------------------------------------
prometheus:
  enabled: true

  prometheusSpec:
    # Retention
    retention: 30d
    retentionSize: "45GB"

    # Storage — uses PVC from kubernetes/storage/persistent-volumes.yaml
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Scrape all ServiceMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # Rule selectors — pick up all PrometheusRule objects cluster-wide
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Security
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

    # Additional scrape configs for targets without ServiceMonitors
    additionalScrapeConfigs:
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      - job_name: "cluster-autoscaler"
        static_configs:
          - targets: ["cluster-autoscaler.kube-system.svc.cluster.local:8085"]
        metrics_path: /metrics

      - job_name: "argocd"
        static_configs:
          - targets:
              - "argocd-metrics.argocd.svc.cluster.local:8082"
              - "argocd-server-metrics.argocd.svc.cluster.local:8083"
              - "argocd-repo-server.argocd.svc.cluster.local:8084"
        metrics_path: /metrics

      - job_name: "jenkins"
        static_configs:
          - targets: ["jenkins.jenkins.svc.cluster.local:8080"]
        metrics_path: /prometheus

    nodeSelector:
      role: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists

    podAntiAffinity: "soft"
    podAntiAffinityTopologyKey: kubernetes.io/hostname

  # Prometheus Ingress
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Prometheus — Authentication Required"
    hosts:
      - prometheus.devops-platform.internal
    paths:
      - /
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.devops-platform.internal

  serviceMonitor:
    selfMonitor: true

# -------------------------------------------------------------------
# Alertmanager
# -------------------------------------------------------------------
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    nodeSelector:
      role: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists

    # Load alertmanager config from our custom ConfigMap
    configSecret: alertmanager-config-secret

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Alertmanager"
    hosts:
      - alertmanager.devops-platform.internal
    paths:
      - /
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.devops-platform.internal

# -------------------------------------------------------------------
# Grafana
# -------------------------------------------------------------------
grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: UTC
  adminPassword: "changeme-set-via-secret"   # Override via grafana.adminPasswordSecret

  adminUser: admin
  adminPasswordSecret: grafana-admin-secret
  adminPasswordSecretKey: admin-password

  replicas: 1

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  # Datasources — auto-configure Prometheus
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      url: http://kube-prometheus-stack-prometheus:9090
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: "30s"
        queryTimeout: "60s"
        httpMethod: POST

    - name: Alertmanager
      type: alertmanager
      url: http://kube-prometheus-stack-alertmanager:9093
      access: proxy
      jsonData:
        handleGrafanaManagedAlerts: false
        implementation: prometheus

  # Dashboard providers — load dashboards from ConfigMaps
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

        - name: "kubernetes"
          orgId: 1
          folder: "Kubernetes"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes

        - name: "application"
          orgId: 1
          folder: "Application"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/application

        - name: "platform"
          orgId: 1
          folder: "Platform"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/platform

  # Import community dashboards by ID
  dashboards:
    kubernetes:
      k8s-cluster-overview:
        gnetId: 15661
        revision: 1
        datasource: Prometheus
      k8s-namespace-overview:
        gnetId: 13770
        revision: 1
        datasource: Prometheus
      k8s-pod-overview:
        gnetId: 16237
        revision: 1
        datasource: Prometheus
      k8s-persistentvolumes:
        gnetId: 13646
        revision: 2
        datasource: Prometheus

    platform:
      nginx-ingress:
        gnetId: 9614
        revision: 1
        datasource: Prometheus
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      jenkins:
        gnetId: 9964
        revision: 1
        datasource: Prometheus
      cert-manager:
        gnetId: 11001
        revision: 1
        datasource: Prometheus

  # Grafana.ini overrides
  grafana.ini:
    server:
      root_url: "https://grafana.devops-platform.internal"
      domain: "grafana.devops-platform.internal"

    auth:
      disable_login_form: false
      disable_signout_menu: false

    auth.anonymous:
      enabled: false

    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer

    security:
      admin_user: admin
      cookie_secure: true
      strict_transport_security: true
      x_content_type_options: true
      x_xss_protection: true

    log:
      mode: console
      level: info

    analytics:
      reporting_enabled: false
      check_for_updates: false

    alerting:
      enabled: true

    unified_alerting:
      enabled: true

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - grafana.devops-platform.internal
    path: /
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.devops-platform.internal

  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"

# -------------------------------------------------------------------
# Node Exporter
# -------------------------------------------------------------------
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  tolerations:
    - operator: Exists    # Run on all nodes including tainted ones

# -------------------------------------------------------------------
# Kube State Metrics
# -------------------------------------------------------------------
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# -------------------------------------------------------------------
# Kube components — disable those not accessible on EKS
# -------------------------------------------------------------------
kubeControllerManager:
  enabled: false    # Not accessible on EKS managed control plane

kubeScheduler:
  enabled: false    # Not accessible on EKS managed control plane

kubeEtcd:
  enabled: false    # Not accessible on EKS managed control plane

kubeProxy:
  enabled: false    # EKS uses VPC networking without standard kubeProxy

kubelet:
  enabled: true
  serviceMonitor:
    https: true
    cAdvisor: true

kubeApiServer:
  enabled: true
