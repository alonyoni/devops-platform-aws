---
# ServiceMonitor: Application (app-dev and app-prod)
# Prometheus auto-discovers app pods via this ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/component: monitoring
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - app-dev
      - app-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor: Jenkins
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jenkins-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: monitoring
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - jenkins
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  endpoints:
    - port: http
      path: /prometheus
      interval: 60s
      scrapeTimeout: 15s

---
# ServiceMonitor: ArgoCD
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: monitoring
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-metrics
          - argocd-server
          - argocd-repo-server
          - argocd-applicationset-controller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s

