---
# ServiceMonitor: Cluster Autoscaler
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cluster-autoscaler-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cluster-autoscaler
    app.kubernetes.io/component: monitoring
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-autoscaler
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s

---
# PodMonitor: Any pod with prometheus.io/scrape=true annotation
# Catches pods that don't have a corresponding Service
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: annotated-pods
  namespace: monitoring
  labels:
    app.kubernetes.io/component: monitoring
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: Exists
  podMetricsEndpoints:
    - path: /metrics
      port: metrics
      interval: 30s
