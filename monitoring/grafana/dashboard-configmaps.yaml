    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
  annotations:
    grafana_folder: "Application"
data:
  app-slo.json: |-
    # Loaded from monitoring/grafana/dashboards/application-slo-dashboard.json
    # kubectl create configmap grafana-dashboard-app-slo \
    #   --from-file=app-slo.json=monitoring/grafana/dashboards/application-slo-dashboard.json \
    #   -n monitoring \
    #   --dry-run=client -o yaml | kubectl apply -f -
