---
# ServiceAccount: Jenkins
# Annotated with IRSA role ARN for ECR push/pull via AWS IAM
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: ci-cd
  annotations:
    # Replace with actual ARN from Terraform output: jenkins_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/devops-platform-dev-jenkins-role"

---
# ServiceAccount: ArgoCD application controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops

---
# ServiceAccount: Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring

---
# ServiceAccount: Cluster Autoscaler
# Annotated with IRSA role ARN
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cluster-autoscaler
  annotations:
    # Replace with actual ARN from Terraform output: cluster_autoscaler_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/devops-platform-dev-cluster-autoscaler-role"

---
# ServiceAccount: AWS Load Balancer Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
  annotations:
    # Replace with actual ARN from Terraform output: alb_controller_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/devops-platform-dev-alb-controller-role"

---
# ServiceAccount: Application (app-dev)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: app-dev
  labels:
    app.kubernetes.io/name: app
    environment: dev

---
# ServiceAccount: Application (app-prod)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: app-prod
  labels:
    app.kubernetes.io/name: app
    environment: prod
