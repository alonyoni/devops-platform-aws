## Jenkins Helm Chart Values
## Chart: jenkins/jenkins
## https://github.com/jenkinsci/helm-charts

controller:
  image: "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/devops-platform/jenkins-agent"
  tag: "latest"
  imagePullPolicy: "Always"

  # Resource requests/limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # JVM options
  javaOpts: >-
    -Xms512m
    -Xmx2g
    -XX:+UseG1GC
    -XX:+ExplicitGCInvokesConcurrent
    -Djava.awt.headless=true
    -Djenkins.install.runSetupWizard=false

  # Service configuration
  serviceType: ClusterIP
  servicePort: 8080
  agentListenerPort: 50000

  # Admin credentials — override via Kubernetes secret in production
  adminSecret: true
  adminUser: "admin"
  # adminPassword set via existingSecret below

  existingSecret: "jenkins-admin-secret"
  adminSshKeySecret: ""

  # Enable Prometheus metrics endpoint
  prometheus:
    enabled: true
    scrapeInterval: 60s
    scrapeEndpoint: /prometheus
    serviceMonitorNamespace: "monitoring"
    serviceMonitorAdditionalLabels:
      release: kube-prometheus-stack

  # Ingress
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    hostName: jenkins.devops-platform.internal
    tls:
      - secretName: jenkins-tls
        hosts:
          - jenkins.devops-platform.internal

  # JCasC — Jenkins Configuration as Code
  JCasC:
    defaultConfig: true
    configScripts:
      # Global security configuration
      security: |
        security:
          globalJobDslSecurityConfiguration:
            useScriptSecurity: false
          remotingCLI:
            enabled: false

      # Credentials (use Kubernetes secrets mounted as env vars)
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-credentials"
                      username: "${GITHUB_USER}"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub credentials"
                  - aws:
                      scope: GLOBAL
                      id: "aws-credentials"
                      accessKey: "${AWS_ACCESS_KEY_ID}"
                      secretKey: "${AWS_SECRET_ACCESS_KEY}"
                      description: "AWS credentials for ECR"
                  - string:
                      scope: GLOBAL
                      id: "sonarqube-token"
                      secret: "${SONAR_TOKEN}"
                      description: "SonarQube authentication token"

      # Pipeline shared library
      jobs: |
        jobs:
          - script: |
              multibranchPipelineJob('devops-platform/app') {
                branchSources {
                  github {
                    id('app-pipeline')
                    scanCredentialsId('github-credentials')
                    repoOwner('your-org')
                    repository('devops-platform')
                    includes('main feature/* release/* hotfix/*')
                  }
                }
                factory {
                  workflowBranchProjectFactory {
                    scriptPath('Jenkinsfile')
                  }
                }
                triggers {
                  periodic(5)
                }
              }

      # Cloud (Kubernetes pod templates for dynamic agents)
      clouds: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: ""
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                jenkinsTunnel: "jenkins-agent:50000"
                connectTimeout: 5
                readTimeout: 15
                containerCapStr: "10"
                podLabels:
                  - key: "jenkins"
                    value: "agent"
                templates:
                  - name: "default"
                    label: "jenkins-agent"
                    nodeUsageMode: NORMAL
                    containers:
                      - name: jnlp
                        image: "jenkins/inbound-agent:latest-jdk17"
                        alwaysPullImage: true
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                  - name: "docker-agent"
                    label: "docker"
                    nodeUsageMode: NORMAL
                    volumes:
                      - hostPathVolume:
                          hostPath: "/var/run/docker.sock"
                          mountPath: "/var/run/docker.sock"
                    containers:
                      - name: jnlp
                        image: "jenkins/inbound-agent:latest-jdk17"
                        alwaysPullImage: true
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                      - name: docker
                        image: "docker:24-dind"
                        alwaysPullImage: true
                        privileged: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "2"
                        resourceLimitMemory: "2Gi"
                      - name: kubectl
                        image: "bitnami/kubectl:latest"
                        command: "sleep"
                        args: "infinity"
                        resourceRequestCpu: "100m"
                        resourceRequestMemory: "128Mi"
                        resourceLimitCpu: "200m"
                        resourceLimitMemory: "256Mi"
                      - name: helm
                        image: "alpine/helm:latest"
                        command: "sleep"
                        args: "infinity"
                        resourceRequestCpu: "100m"
                        resourceRequestMemory: "128Mi"
                        resourceLimitCpu: "200m"
                        resourceLimitMemory: "256Mi"

  # Plugins to pre-install
  installPlugins:
    - kubernetes:4203.v1dd44f5b_1cf9
    - workflow-aggregator:596.v8c21c963d92d
    - git:5.2.1
    - configuration-as-code:1810.v9b_c30a_249a_4c
    - job-dsl:1.87
    - blueocean:1.27.9
    - docker-workflow:572.v950f58993843
    - amazon-ecr:1.114.vb_7e3571fa_740
    - pipeline-aws:1.43
    - sonar:2.17.1
    - junit:1207.va_09d5100410f
    - jacoco:3.3.4
    - slack:695.v0b_86b_a_82c97a_
    - github-branch-source:1786.v7a_3b_5b_7b_b_b_b_b
    - pipeline-stage-view:2.33
    - build-timeout:1.31
    - credentials-binding:681.vf91669a_32e45
    - timestamper:1.26
    - ws-cleanup:0.46
    - ansicolor:1.0.2
    - warnings-ng:11.1.0
    - prometheus:779.v61e8d82e626f

  # Environment variables from Kubernetes secrets
  containerEnv:
    - name: GITHUB_USER
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: username
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: token
    - name: SONAR_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-sonar-secret
          key: token
    - name: AWS_REGION
      value: "us-east-1"

  # Node affinity — schedule on system nodes
  nodeSelector:
    role: system

  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"

  # Pod annotations
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/prometheus"

agent:
  enabled: true
  defaultsProviderTemplate: ""
  jenkinsUrl: "http://jenkins:8080"
  jenkinsTunnel: "jenkins-agent:50000"
  kubernetesConnectTimeout: 5
  kubernetesReadTimeout: 15
  maxRequestsPerHostStr: "32"
  namespace: jenkins
  image: "jenkins/inbound-agent"
  tag: "latest-jdk17"
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

persistence:
  enabled: true
  existingClaim: "jenkins-home"
  storageClass: "gp3-retain"
  size: "50Gi"

serviceAccount:
  create: false
  name: "jenkins"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/devops-platform-dev-jenkins-role"

rbac:
  create: false
  readSecrets: true

networkPolicy:
  enabled: false   # Managed by our own NetworkPolicy manifests
