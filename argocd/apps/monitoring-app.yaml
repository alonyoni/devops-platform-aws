---
# ArgoCD Application: kube-prometheus-stack (monitoring)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/component: platform-tool
    tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: devops-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "57.0.3"
    helm:
      releaseName: kube-prometheus-stack
      valueFiles:
        - $values/monitoring/helm-values.yaml
      # Inline values that override the values file
      values: |
        alertmanager:
          alertmanagerSpec:
            replicas: 1

  # Second source: the GitOps repo for values files
  sources:
    - repoURL: https://github.com/your-org/devops-platform-gitops
      targetRevision: main
      ref: values

    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "57.0.3"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/monitoring/helm-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    # Required for large CRDs
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
