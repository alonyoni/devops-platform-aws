---
# AppProject: platform — for cluster-level infrastructure tools
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/component: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Platform infrastructure: monitoring, ingress, cert-manager, etc."

  sourceRepos:
    - "https://github.com/your-org/devops-platform-gitops"
    - "https://argoproj.github.io/argo-helm"
    - "https://charts.jetstack.io"
    - "https://kubernetes.github.io/ingress-nginx"
    - "https://prometheus-community.github.io/helm-charts"

  destinations:
    - namespace: "monitoring"
      server: https://kubernetes.default.svc
    - namespace: "argocd"
      server: https://kubernetes.default.svc
    - namespace: "ingress-nginx"
      server: https://kubernetes.default.svc
    - namespace: "kube-system"
      server: https://kubernetes.default.svc
    - namespace: "jenkins"
      server: https://kubernetes.default.svc
    - namespace: "cert-manager"
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "storage.k8s.io"
      kind: StorageClass
    - group: "networking.k8s.io"
      kind: IngressClass
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "admissionregistration.k8s.io"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: admin
      description: Full access to platform project
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - your-org:platform-team

---
# AppProject: applications — for workload deployments
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
  labels:
    app.kubernetes.io/component: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Application workloads: dev and prod environments"

  sourceRepos:
    - "https://github.com/your-org/devops-platform-gitops"
    - "https://github.com/your-org/devops-platform"

  destinations:
    - namespace: "app-dev"
      server: https://kubernetes.default.svc
    - namespace: "app-prod"
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  roles:
    - name: admin
      description: Full access to applications project
      policies:
        - p, proj:applications:admin, applications, *, applications/*, allow
      groups:
        - your-org:platform-team

    - name: developer
      description: Developers can sync and view app deployments
      policies:
        - p, proj:applications:developer, applications, get, applications/*, allow
        - p, proj:applications:developer, applications, sync, applications/*, allow
      groups:
        - your-org:dev-team

    - name: ci-bot
      description: Jenkins CI can sync applications
      policies:
        - p, proj:applications:ci-bot, applications, sync, applications/*, allow
        - p, proj:applications:ci-bot, applications, get, applications/*, allow
      groups:
        - jenkins
