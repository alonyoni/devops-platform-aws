---
# ArgoCD Image Updater
# Automatically detects new ECR image tags and updates the GitOps repo.
# This works alongside Jenkins (Jenkins pushes, Image Updater writes to GitOps).
#
# NOTE: If you prefer Jenkins to write to GitOps directly (via updateGitOps shared lib),
# you can disable this Application. Both approaches work; pick one.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/component: platform-tool
    tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: "0.9.6"
    helm:
      releaseName: argocd-image-updater
      values: |
        config:
          argocd:
            serverAddress: http://argocd-server.argocd.svc.cluster.local
            insecure: true

          registries:
            - name: ECR
              api_url: https://123456789012.dkr.ecr.us-east-1.amazonaws.com
              prefix: 123456789012.dkr.ecr.us-east-1.amazonaws.com
              ping: yes
              insecure: no
              credentials: ext:/scripts/ecr-login.sh
              credsexpire: 10h

        authScripts:
          enabled: true
          scripts:
            ecr-login.sh: |
              #!/bin/sh
              aws ecr get-login-password --region us-east-1 \
                | echo "AWS:$(cat -)"

        serviceAccount:
          create: true
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/devops-platform-dev-jenkins-role"

        nodeSelector:
          role: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring
            additionalLabels:
              release: kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
